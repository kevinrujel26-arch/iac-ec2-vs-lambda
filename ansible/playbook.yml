- name: Configurar servidor web de la comparativa EC2 vs Lambda
  hosts: localhost
  connection: local
  become: true
  vars:
    app_env: dev

  tasks:
    - name: Instalar nginx
      ansible.builtin.dnf:
        name: nginx
        state: present


    - name: Asegurar que nginx este activo y arranque con el servidor
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Reiniciar nginx
      ansible.builtin.service:
        name: nginx
        state: restarted